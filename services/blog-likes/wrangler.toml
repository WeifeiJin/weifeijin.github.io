name = "weifeijin-blog-likes"
main = "worker.mjs"
compatibility_date = "2026-10-06"
workers_dev = true

[vars]
ENVIRONMENT = "production"
SITE_ORIGIN = "https://weifeijin.com"
TRANSITION_ORIGIN = "https://weifeijin.github.io"
ALLOW_HTTP_TRANSITION = "true"
ALLOWED_SLUGS = "from-research-to-researcher"

[[routes]]
pattern = "likes.weifeijin.com"
custom_domain = true
zone_id = "1b987886dff1fadc769a64634550d09a"

[[d1_databases]]
binding = "DB"
database_name = "weifeijin-blog-likes"
database_id = "201a0a44-8281-4917-895e-d189c4066618"

[observability]
enabled = false
